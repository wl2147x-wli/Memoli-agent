[project]
name = "memoli-agent"
version = "0.1.0"
description = "A memory-focused extensible agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [
  { name = "Memoli-agent contributors" }
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "pyright>=1.1.0"
]

[tool.pyright]
include = ["memoli_agent"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

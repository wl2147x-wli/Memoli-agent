[dataset]
name = "locomo"
path = "../locomo/data/locomo10.json"
split = "locomo10"
sample_size = 1
seed = 42
question_types = ["single-hop", "multi-hop", "temporal", "open-domain", "adversarial"]
max_sessions = 0

[agent]
type = "memoli"
config_path = "config.benchmark.toml"
workspace_root = "workspace/benchmark"
reset_per_sample = true
reset_memory_per_sample = true
ingest_mode = "memory_write"
answer_mode = "agent_turn"
capture_retrieved_context = false

[metrics]
primary = "f1"
include_retrieval_recall = true
judge_enabled = false
judge_model = "gpt-4o-mini"

[output]
dir = "workspace/benchmark/results"
save_predictions = true
save_metrics = true
save_report = true

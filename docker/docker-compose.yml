version: '2.0'
services:
  chatgpt-on-wechat:
    image: zhayujie/chatgpt-on-wechat
    container_name: chatgpt-on-wechat
    security_opt:
      - seccomp:unconfined
    ports:
      - "9899:9899"
    environment:
      COW_LANG: 'auto'
      CHANNEL_TYPE: 'web, weixin'
      MODEL: 'deepseek-v4-flash'
      DEEPSEEK_API_KEY: ''
      DEEPSEEK_API_BASE: 'https://api.deepseek.com/v1'
      MINIMAX_API_KEY: ''
      ZHIPU_AI_API_KEY: ''
      ARK_API_KEY: ''
      MOONSHOT_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      CLAUDE_API_KEY: ''
      CLAUDE_API_BASE: 'https://api.anthropic.com/v1'
      OPEN_AI_API_KEY: ''
      OPEN_AI_API_BASE: 'https://api.openai.com/v1'
      GEMINI_API_KEY: ''
      GEMINI_API_BASE: 'https://generativelanguage.googleapis.com'
      VOICE_TO_TEXT: 'openai'
      TEXT_TO_VOICE: 'openai'
      VOICE_REPLY_VOICE: 'False'
      SPEECH_RECOGNITION: 'True'
      GROUP_SPEECH_RECOGNITION: 'False'
      USE_LINKAI: 'False'
      LINKAI_API_KEY: ''
      LINKAI_APP_CODE: ''
      FEISHU_APP_ID: ''
      FEISHU_APP_SECRET: ''
      DINGTALK_CLIENT_ID: ''
      DINGTALK_CLIENT_SECRET: ''
      WECOM_BOT_ID: ''
      WECOM_BOT_SECRET: ''
      # 要从主机访问 Web 控制台，请将其设置为“0.0.0.0”并设置 WEB_PASSWORD
      WEB_HOST: '127.0.0.1'
      WEB_PASSWORD: ''
      AGENT: 'True'
      # 容器已经是一个隔离边界，因此代理可以在其中不受限制地运行
      AGENT_PERMISSION_MODE: 'full-access'
      AGENT_MAX_CONTEXT_TOKENS: 50000
      AGENT_MAX_CONTEXT_TURNS: 20
      AGENT_MAX_STEPS: 20
      SELF_EVOLUTION_ENABLED: 'True'
      # 可写数据根（config.json、run.log、凭证）——保持独立
      # 从工作区中删除，以便它能够在映像升级/容器重新创建后继续存在。
      COW_DATA_DIR: '/home/agent/.cow'
    volumes:
      # 工作空间：技能、记忆、知识、mcp.json、对话工件
      - ./cow:/home/agent/cow
      # 数据根：config.json、run.log、凭据
      - ./cow-data:/home/agent/.cow

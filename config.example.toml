[runtime]
workspace = "workspace"

[llm]
provider = "openai-compatible"
model = "gpt-4.1-mini"
api_key = ""
base_url = ""

[agent]
name = "Memoli"
max_iterations = 8
history_window = 20

[memory]
enabled = true
engine = "markdown"
path = "workspace/memory"

[tools]
tool_search_enabled = true

[channels.cli]
enabled = true

[plugins]
enabled = ["memory_default", "shell_safety"]

[subagent]
enabled = true
root = "workspace/subagents"
default_profile = "general"
max_concurrent = 2

[proactive]
enabled = false
interval_seconds = 60
cooldown_seconds = 300
chat_id = "local"
message = "这是一次主动检查。"

[mcp]
enabled = false

[[mcp.servers]]
name = "demo"
transport = "stdio"
command = "python"
args = ["path/to/server.py"]
enabled = false
